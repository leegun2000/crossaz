# crossaz billing rules. Evidence and history: docs/billing-rules.md
#
# Evaluation: declaration order, FIRST match wins. The last rule must be a catch-all (empty match).
# Match keys (all listed keys must hold; a list means "any of"):
#   route                   clusterip|headless|alb|clb|nlb-cross-zone|nlb-zonal|nlb|external
#   target_kind             service|rds|elasticache|msk
#   scheme                  internal|internet-facing
#   target_type             ip|instance
#   external_traffic_policy Cluster|Local
#   traffic                 client|replication
#   az_spread               single|multi|unknown
#   zone_coverage           full|partial|unknown
#   evidence                k8s|aws|annotation
#   same_vpc, private_ip, topology_hints, zone_local   true|false
#   kube_proxy_hints        true|false  kube-proxy is on the path and its version is known to honor EndpointSlice hints
#   hints_configured        true|false  Service sets trafficDistribution or a non-disabled topology-mode annotation
#   direct_ingress_backend  true|false  Service backs a non-ALB Ingress without service-upstream (dials pod IPs)
# Validation rejects any other value.
#
# billable: true|false|unknown. unknown = verdict withheld: neither $0 nor billed, reported as a separate "Unconfirmed $0–max" line.
# rate_gb is USD per GB exchanged, all charged sides combined. 0/absent = region rate.
# Inter-AZ is $0.01/GB charged on EACH side for EC2/ENI <-> EC2/ENI  =>  0.02.
# RDS/ElastiCache/MSK: only the client (EC2) side is documented as charged  =>  0.01.

version: 1
default_rate_gb: 0.02

# AWS Price List (AWSDataTransfer, 2026-09-11): IntraRegion = $0.01/GB per side in every commercial
# and GovCloud Region below. Regions not listed fall back to default_rate_gb with a warning.
regions:
  af-south-1: {rate_gb: 0.02}
  ap-east-1: {rate_gb: 0.02}
  ap-east-2: {rate_gb: 0.02}
  ap-northeast-1: {rate_gb: 0.02}
  ap-northeast-2: {rate_gb: 0.02}
  ap-northeast-3: {rate_gb: 0.02}
  ap-south-1: {rate_gb: 0.02}
  ap-south-2: {rate_gb: 0.02}
  ap-southeast-1: {rate_gb: 0.02}
  ap-southeast-2: {rate_gb: 0.02}
  ap-southeast-3: {rate_gb: 0.02}
  ap-southeast-4: {rate_gb: 0.02}
  ap-southeast-5: {rate_gb: 0.02}
  ap-southeast-6: {rate_gb: 0.02}
  ap-southeast-7: {rate_gb: 0.02}
  ca-central-1: {rate_gb: 0.02}
  ca-west-1: {rate_gb: 0.02}
  eu-central-1: {rate_gb: 0.02}
  eu-central-2: {rate_gb: 0.02}
  eu-north-1: {rate_gb: 0.02}
  eu-south-1: {rate_gb: 0.02}
  eu-south-2: {rate_gb: 0.02}
  eu-west-1: {rate_gb: 0.02}
  eu-west-2: {rate_gb: 0.02}
  eu-west-3: {rate_gb: 0.02}
  il-central-1: {rate_gb: 0.02}
  me-central-1: {rate_gb: 0.02}
  me-south-1: {rate_gb: 0.02}
  mx-central-1: {rate_gb: 0.02}
  sa-east-1: {rate_gb: 0.02}
  us-east-1: {rate_gb: 0.02}
  us-east-2: {rate_gb: 0.02}
  us-west-1: {rate_gb: 0.02}
  us-west-2: {rate_gb: 0.02}
  us-gov-east-1: {rate_gb: 0.02}
  us-gov-west-1: {rate_gb: 0.02}

rules:
  # ---------------------------------------------------------------- common
  - id: same-az
    match: {az_spread: single}
    billable: false
    confidence: high
    reason: "Caller and destination are in the same AZ. Private-IP transfer within an AZ is free"
    source: https://aws.amazon.com/ec2/pricing/on-demand/
    verified: "2026-09-14"

  - id: zone-unknown
    match: {az_spread: unknown}
    billable: unknown
    confidence: low
    reason: "Destination AZ unknown (no zone in the EndpointSlice). With AWS credentials the IP is resolved to an AZ"

  # ---------------------------------------------------------------- NLB
  - id: nlb-cross-zone
    match: {route: nlb-cross-zone}
    billable: true
    confidence: high
    reason: "With cross-zone on for the target group, traffic between an NLB node and a target in another AZ is billed on both ends (instance mode adds a kube-proxy hop)"
    source: https://aws.amazon.com/elasticloadbalancing/faqs/
    verified: "2026-09-14"
    fix:
      kind: disable-nlb-xz
      description: "If every AZ has enough targets, turn cross-zone off on the target group. The target group value takes precedence over the LB value, so set it as a TG attribute. If the annotation already holds other attributes, --overwrite replaces them, so merge the values. Removing the annotation alone does not turn it off"
      command: |
        kubectl annotate svc -n {{.Namespace}} {{.Name}} --overwrite \
          service.beta.kubernetes.io/aws-load-balancer-target-group-attributes=load_balancing.cross_zone.enabled=false

  # ---------------------------------------------------------------- NodePort hop of LB instance mode
  # This hop is billed even when the cross-zone setting is unknown (route nlb), so it comes before nlb-cross-zone-unknown.
  - id: nodeport-hop-cross-az
    match:
      route: [alb, clb, nlb-zonal, nlb]
      target_type: instance
      external_traffic_policy: Cluster
      zone_local: false
    billable: true
    confidence: medium
    reason: "Instance targets: LB to node is free, but when kube-proxy forwards once more to a pod on a node in another AZ, that hop is billed as ordinary inter-AZ traffic"
    source: https://docs.aws.amazon.com/eks/latest/best-practices/cost-opt-networking.html
    verified: "2026-09-14"
    fix:
      kind: PreferClose
      description: "trafficDistribution also applies to external traffic with externalTrafficPolicy: Cluster. The root fix is IP target mode (ALB: alb.ingress.kubernetes.io/target-type=ip, NLB: service.beta.kubernetes.io/aws-load-balancer-nlb-target-type=ip)"
      command: |
        kubectl patch svc -n {{.Namespace}} {{.Name}} --type=merge \
          -p '{"spec":{"trafficDistribution":"{{.TrafficDistribution}}"}}'

  - id: nlb-cross-zone-unknown
    match: {route: nlb}
    billable: true
    confidence: low
    reason: "The actual NLB cross-zone setting cannot be confirmed. It may be on even without the annotation (the LBC does not revert removed attributes); rerun with AWS credentials"
    source: https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/service/annotations/
    verified: "2026-09-14"

  # ---------------------------------------------------------------- kube-proxy keeps traffic zone-local
  - id: ingress-direct-backend
    match: {route: clusterip, zone_local: true, direct_ingress_backend: true}
    billable: false
    confidence: low
    reason: "Zone-local as far as kube-proxy goes, but an Ingress controller pointing at this service (ingress-nginx and others) connects directly to pod IPs by default and bypasses kube-proxy hints. Unless the controller has topology-aware routing or service-upstream set, traffic through the Ingress can cross AZs and be billed"
    source: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#service-upstream
    verified: "2026-09-14"

  # nlb-zonal is left out: even when zone-local, the leg from a VPC client to an NLB node in another AZ remains (nlb-client-cross-az).
  - id: topology-aware-routing
    match: {route: [clusterip, alb, clb], zone_local: true}
    billable: false
    confidence: medium
    reason: "kube-proxy uses only same-AZ endpoints (EndpointSlice hints cover every caller AZ, or internalTrafficPolicy: Local). If the hints are removed it falls back to the whole cluster"
    source: https://kubernetes.io/docs/concepts/services-networking/topology-aware-routing/
    verified: "2026-09-14"

  # ---------------------------------------------------------------- ALB / CLB
  - id: alb-ip-target-mode
    match: {route: alb, target_type: ip, same_vpc: true, private_ip: true}
    billable: false
    confidence: medium
    reason: "ALB sends directly to pod IPs. The EKS Best Practices guide says IP mode has no transfer charge, but the EC2 pricing wording names only 'EC2 instances'; cross-check with --verify"
    source: https://docs.aws.amazon.com/eks/latest/best-practices/cost-opt-networking.html
    verified: "2026-09-14"

  - id: alb-private-same-vpc
    match: {route: alb, same_vpc: true, private_ip: true}
    billable: false
    confidence: high
    reason: "EC2 to/from ALB over private IPs in the same VPC is free regardless of AZ (and of the cross-zone setting)"
    source: https://aws.amazon.com/ec2/pricing/on-demand/
    verified: "2026-09-14"

  - id: clb-private-same-vpc
    match: {route: clb, same_vpc: true, private_ip: true}
    billable: false
    confidence: high
    reason: "EC2 to/from a Classic LB over private IPs in the same VPC is free"
    source: https://aws.amazon.com/ec2/pricing/on-demand/
    verified: "2026-09-14"

  - id: lb-exemption-unverified
    match: {route: [alb, clb]}
    billable: true
    confidence: low
    reason: "IPv6 or non-private IPv4 targets, or an LB in another VPC: no official wording says the ALB/CLB transfer exemption (private IP, same VPC) covers this case"
    source: https://aws.amazon.com/ec2/pricing/on-demand/
    verified: "2026-09-14"

  # ---------------------------------------------------------------- NLB (cross-zone off)
  - id: nlb-client-cross-az
    match: {route: nlb-zonal, scheme: internal}
    billable: true
    confidence: low
    reason: "Even with cross-zone off, a client inside the VPC that gets the IP of an NLB node in another AZ from DNS is billed. Depends on client placement and the DNS routing policy"
    source: https://aws.amazon.com/blogs/networking-and-content-delivery/exploring-data-transfer-costs-for-aws-network-load-balancers/
    verified: "2026-09-14"
    fix:
      kind: zonal-dns
      description: "For in-cluster callers use ClusterIP + trafficDistribution instead of the NLB, or set the NLB attribute dns_record.client_routing_policy=availability_zone_affinity"

  - id: nlb-zonal-internet
    match: {route: nlb-zonal, scheme: internet-facing}
    billable: false
    confidence: medium
    reason: "Cross-zone off: each LB node forwards only to targets in its own AZ. Internet-to-NLB ingress is not inter-AZ transfer (calling the public IP from inside the VPC incurs a separate public-IP charge)"
    source: https://aws.amazon.com/blogs/networking-and-content-delivery/exploring-data-transfer-costs-for-aws-network-load-balancers/
    verified: "2026-09-14"

  # ---------------------------------------------------------------- pod ↔ pod
  # Callers in an AZ without an endpoint cross whether hints work or not, so this is decided before hints-unverified and hints-withheld.
  - id: clusterip-cross-az-partial
    match: {route: clusterip, az_spread: multi, zone_coverage: [partial, unknown]}
    billable: true
    confidence: high
    reason: "Callers in an AZ without an endpoint always cross to another AZ (trafficDistribution cannot fix this)"
    source: https://docs.aws.amazon.com/eks/latest/best-practices/cost-opt-networking.html
    verified: "2026-09-14"
    fix:
      kind: topologySpread
      description: "Add topologySpreadConstraints (topology.kubernetes.io/zone) so every AZ gets an endpoint, then set trafficDistribution"

  - id: hints-unverified
    match: {route: clusterip, az_spread: multi, hints_configured: true, kube_proxy_hints: false}
    billable: true
    confidence: low
    reason: "trafficDistribution/topology-mode is set, but zone-local routing cannot be confirmed: the kube-proxy version is unknown (or a replacement proxy is in use), or it is not a version known to use this service's hints"
    source: https://kubernetes.io/docs/concepts/services-networking/topology-aware-routing/
    verified: "2026-09-14"

  # A hint-aware kube-proxy spreads across all endpoints when any endpoint lacks a hint (billed for sure).
  - id: hints-withheld
    match: {route: clusterip, az_spread: multi, hints_configured: true, kube_proxy_hints: true, topology_hints: false}
    billable: true
    confidence: high
    reason: "Zone routing is configured and kube-proxy is a hint-aware version, but the EndpointSlice has no hints (for example topology-mode Auto withheld them for too few endpoints per AZ or overload). When any endpoint lacks a hint, kube-proxy spreads across all endpoints"
    source: https://kubernetes.io/docs/concepts/services-networking/topology-aware-routing/
    verified: "2026-09-14"
    fix:
      kind: PreferClose
      description: "The topology-mode annotation takes precedence over trafficDistribution, so remove the annotation and set trafficDistribution (no per-AZ endpoint count requirement). To keep Auto, add endpoints in every AZ; see why hints were withheld with kubectl get events --field-selector reason=TopologyAwareHintsDisabled"
      command: |
        kubectl annotate svc -n {{.Namespace}} {{.Name}} service.kubernetes.io/topology-mode- service.kubernetes.io/topology-aware-hints-
        kubectl patch svc -n {{.Namespace}} {{.Name}} --type=merge \
          -p '{"spec":{"trafficDistribution":"{{.TrafficDistribution}}"}}'

  - id: clusterip-cross-az
    match: {route: clusterip, az_spread: multi}
    billable: true
    confidence: high
    reason: "kube-proxy picks endpoints regardless of AZ. The share sent to pods in other AZs is billed $0.01/GB on each side"
    source: https://docs.aws.amazon.com/eks/latest/best-practices/cost-opt-networking.html
    verified: "2026-09-14"
    fix:
      kind: PreferClose
      description: "Set trafficDistribution on the Service (k8s 1.31-1.33: PreferClose, 1.34+: PreferSameZone, same meaning)"
      command: |
        kubectl patch svc -n {{.Namespace}} {{.Name}} --type=merge \
          -p '{"spec":{"trafficDistribution":"{{.TrafficDistribution}}"}}'

  - id: headless-cross-az
    match: {route: headless, az_spread: multi}
    billable: true
    confidence: high
    reason: "Headless services connect to pod IPs through DNS (no kube-proxy, trafficDistribution has no effect). StatefulSet replication across AZs is billed"
    source: https://aws.amazon.com/ec2/pricing/on-demand/
    verified: "2026-09-14"
    fix:
      kind: relocate
      description: "Replication traffic is the price of HA. Make only reads zone-local: Kafka with broker.rack/client.rack (follower fetching), Elasticsearch with shard allocation awareness"

  # ---------------------------------------------------------------- AWS managed services (outside the cluster)
  - id: rds-multiaz-replication
    match: {target_kind: rds, traffic: replication}
    billable: false
    confidence: high
    reason: "Multi-AZ primary-standby, same-region read replicas and Aurora cluster replication are free"
    source: https://aws.amazon.com/rds/pricing/
    verified: "2026-09-14"

  - id: msk-inter-broker
    match: {target_kind: msk, traffic: replication}
    billable: false
    confidence: high
    reason: "Replication between MSK brokers is included in the price"
    source: https://aws.amazon.com/msk/pricing/
    verified: "2026-09-14"

  - id: rds-cross-az
    match: {target_kind: rds, traffic: client, az_spread: multi}
    billable: true
    rate_gb: 0.01
    confidence: high
    reason: "Pod to/from an RDS/Aurora instance in another AZ (primary or replica). Billed $0.01/GB on the EC2 side only"
    source: https://aws.amazon.com/rds/pricing/
    verified: "2026-09-14"
    fix:
      kind: relocate
      description: "Send reads to a replica in the same AZ, and consider placing write-heavy workloads in the primary's AZ"

  - id: elasticache-cross-az
    match: {target_kind: elasticache, traffic: client, az_spread: multi}
    billable: true
    rate_gb: 0.01
    confidence: high
    reason: "Pod to/from an ElastiCache node in another AZ. Billed $0.01/GB on the EC2 side only"
    source: https://aws.amazon.com/elasticache/pricing/
    verified: "2026-09-14"
    fix:
      kind: relocate
      description: "Read from a replica in the same AZ (client AZ affinity) and place nodes in the callers' AZs"

  - id: msk-client-cross-az
    match: {target_kind: msk, traffic: client, az_spread: multi}
    billable: true
    rate_gb: 0.01
    confidence: medium
    reason: "Client to/from a broker in another AZ is charged at the standard rate. Only the client (EC2) side is officially confirmed, so this is a lower bound"
    source: https://aws.amazon.com/msk/pricing/
    verified: "2026-09-14"
    fix:
      kind: relocate
      description: "Set client.rack=<AZ ID> on consumers (follower fetching, replica.selector.class=RackAwareReplicaSelector)"

  # ---------------------------------------------------------------- catch-all
  - id: unclassified
    match: {}
    billable: unknown
    confidence: low
    reason: "Matches no rule; verdict withheld"
