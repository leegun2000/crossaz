# crossaz billing rules. Evidence and history: docs/billing-rules.md
#
# Evaluation: declaration order, FIRST match wins. The last rule must be a catch-all (empty match).
# Match keys (all listed keys must hold; a list means "any of"):
#   route                   clusterip|headless|alb|clb|nlb-cross-zone|nlb-zonal|nlb|external
#   target_kind             service|rds|elasticache|msk
#   scheme                  internal|internet-facing
#   target_type             ip|instance
#   external_traffic_policy Cluster|Local
#   traffic                 client|replication
#   az_spread               single|multi|unknown
#   zone_coverage           full|partial|unknown
#   evidence                k8s|aws|annotation
#   same_vpc, private_ip, topology_hints, zone_local   true|false
#   hints_configured        true|false  Service sets trafficDistribution or a non-disabled topology-mode annotation
#   direct_ingress_backend  true|false  Service backs a non-ALB Ingress without service-upstream (dials pod IPs)
# Validation rejects any other value.
#
# rate_gb is USD per GB exchanged, all charged sides combined. 0/absent = region rate.
# Inter-AZ is $0.01/GB charged on EACH side for EC2/ENI <-> EC2/ENI  =>  0.02.
# RDS/ElastiCache/MSK: only the client (EC2) side is documented as charged  =>  0.01.

version: 1
default_rate_gb: 0.02

# AWS Price List (AWSDataTransfer, 2026-09-11): IntraRegion = $0.01/GB per side in every commercial
# and GovCloud Region below. Regions not listed fall back to default_rate_gb with a warning.
regions:
  af-south-1: {rate_gb: 0.02}
  ap-east-1: {rate_gb: 0.02}
  ap-east-2: {rate_gb: 0.02}
  ap-northeast-1: {rate_gb: 0.02}
  ap-northeast-2: {rate_gb: 0.02}
  ap-northeast-3: {rate_gb: 0.02}
  ap-south-1: {rate_gb: 0.02}
  ap-south-2: {rate_gb: 0.02}
  ap-southeast-1: {rate_gb: 0.02}
  ap-southeast-2: {rate_gb: 0.02}
  ap-southeast-3: {rate_gb: 0.02}
  ap-southeast-4: {rate_gb: 0.02}
  ap-southeast-5: {rate_gb: 0.02}
  ap-southeast-6: {rate_gb: 0.02}
  ap-southeast-7: {rate_gb: 0.02}
  ca-central-1: {rate_gb: 0.02}
  ca-west-1: {rate_gb: 0.02}
  eu-central-1: {rate_gb: 0.02}
  eu-central-2: {rate_gb: 0.02}
  eu-north-1: {rate_gb: 0.02}
  eu-south-1: {rate_gb: 0.02}
  eu-south-2: {rate_gb: 0.02}
  eu-west-1: {rate_gb: 0.02}
  eu-west-2: {rate_gb: 0.02}
  eu-west-3: {rate_gb: 0.02}
  il-central-1: {rate_gb: 0.02}
  me-central-1: {rate_gb: 0.02}
  me-south-1: {rate_gb: 0.02}
  mx-central-1: {rate_gb: 0.02}
  sa-east-1: {rate_gb: 0.02}
  us-east-1: {rate_gb: 0.02}
  us-east-2: {rate_gb: 0.02}
  us-west-1: {rate_gb: 0.02}
  us-west-2: {rate_gb: 0.02}
  us-gov-east-1: {rate_gb: 0.02}
  us-gov-west-1: {rate_gb: 0.02}

rules:
  # ---------------------------------------------------------------- 공통
  - id: same-az
    match: {az_spread: single}
    billable: false
    confidence: high
    reason: "호출자와 목적지가 모두 같은 AZ. 같은 AZ 내 사설 IP 전송은 무료"
    source: https://aws.amazon.com/ec2/pricing/on-demand/
    verified: "2026-09-14"

  - id: zone-unknown
    match: {az_spread: unknown}
    billable: false
    confidence: low
    reason: "목적지 AZ를 알 수 없음 (EndpointSlice zone 없음). AWS 자격증명이 있으면 IP→AZ로 해석"

  # ---------------------------------------------------------------- NLB
  - id: nlb-cross-zone
    match: {route: nlb-cross-zone}
    billable: true
    confidence: high
    reason: "NLB cross-zone이 켜진 타겟그룹은 LB 노드와 다른 AZ 타겟 사이 전송이 양쪽 끝에서 과금 (instance 모드면 kube-proxy 홉 추가)"
    source: https://aws.amazon.com/elasticloadbalancing/faqs/
    verified: "2026-09-14"
    fix:
      kind: disable-nlb-xz
      description: "AZ마다 타겟이 충분하면 타겟그룹 cross-zone을 끈다. 타겟그룹 값이 LB 값보다 우선하므로 TG 속성으로 설정. annotation에 다른 속성이 이미 있으면 --overwrite가 덮어쓰니 값을 합칠 것. annotation을 지우는 것만으로는 꺼지지 않음"
      command: |
        kubectl annotate svc -n {{.Namespace}} {{.Name}} --overwrite \
          service.beta.kubernetes.io/aws-load-balancer-target-group-attributes=load_balancing.cross_zone.enabled=false

  # ---------------------------------------------------------------- LB instance 모드의 NodePort 홉
  # cross-zone 설정을 몰라도(route nlb) 이 홉은 과금되므로 nlb-cross-zone-unknown보다 앞에 둔다.
  - id: nodeport-hop-cross-az
    match:
      route: [alb, clb, nlb-zonal, nlb]
      target_type: instance
      external_traffic_policy: Cluster
      zone_local: false
    billable: true
    confidence: medium
    reason: "instance 타겟: LB→노드는 무료지만 kube-proxy가 다른 AZ 노드의 pod로 한 번 더 보내면 그 홉은 일반 inter-AZ 과금"
    source: https://docs.aws.amazon.com/eks/latest/best-practices/cost-opt-networking.html
    verified: "2026-09-14"
    fix:
      kind: PreferClose
      description: "trafficDistribution은 externalTrafficPolicy: Cluster인 외부 트래픽에도 적용됨. 근본 해결은 IP 타겟 모드(ALB: alb.ingress.kubernetes.io/target-type=ip, NLB: service.beta.kubernetes.io/aws-load-balancer-nlb-target-type=ip)"
      command: |
        kubectl patch svc -n {{.Namespace}} {{.Name}} --type=merge \
          -p '{"spec":{"trafficDistribution":"{{.TrafficDistribution}}"}}'

  - id: nlb-cross-zone-unknown
    match: {route: nlb}
    billable: true
    confidence: low
    reason: "NLB cross-zone 실제 설정을 확인할 수 없음. annotation이 없어도 켜져 있을 수 있음(LBC는 제거된 속성을 되돌리지 않음) → AWS 자격증명으로 재실행"
    source: https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/service/annotations/
    verified: "2026-09-14"

  # ---------------------------------------------------------------- kube-proxy가 zone-local로 보냄
  - id: ingress-direct-backend
    match: {route: clusterip, zone_local: true, direct_ingress_backend: true}
    billable: false
    confidence: low
    reason: "kube-proxy 기준으로는 zone-local이지만, 이 서비스를 가리키는 Ingress 컨트롤러(ingress-nginx 등)는 기본적으로 pod IP로 직접 연결해 kube-proxy 힌트를 우회함. 컨트롤러에 topology-aware routing이나 service-upstream이 설정돼 있지 않으면 Ingress 경유 트래픽은 AZ를 넘어 과금될 수 있음"
    source: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#service-upstream
    verified: "2026-09-14"

  # nlb-zonal은 제외: zone-local이어도 VPC 클라이언트 → 다른 AZ NLB 노드 다리는 남는다(nlb-client-cross-az).
  - id: topology-aware-routing
    match: {route: [clusterip, alb, clb], zone_local: true}
    billable: false
    confidence: medium
    reason: "kube-proxy가 같은 AZ 엔드포인트만 사용 (EndpointSlice 힌트가 모든 호출자 AZ를 덮음, 또는 internalTrafficPolicy: Local). 힌트가 제거되면 클러스터 전체로 폴백"
    source: https://kubernetes.io/docs/concepts/services-networking/topology-aware-routing/
    verified: "2026-09-14"

  # ---------------------------------------------------------------- ALB / CLB
  - id: alb-ip-target-mode
    match: {route: alb, target_type: ip, same_vpc: true, private_ip: true}
    billable: false
    confidence: medium
    reason: "ALB→pod IP 직접 전송. EKS Best Practices는 IP 모드에 전송료 없음으로 설명하나, EC2 요금 문구는 'EC2 인스턴스'만 명시 → --verify로 대조 권장"
    source: https://docs.aws.amazon.com/eks/latest/best-practices/cost-opt-networking.html
    verified: "2026-09-14"

  - id: alb-private-same-vpc
    match: {route: alb, same_vpc: true, private_ip: true}
    billable: false
    confidence: high
    reason: "EC2↔ALB 사설 IP·동일 VPC 전송은 AZ와 무관하게 무료 (cross-zone 설정과 무관)"
    source: https://aws.amazon.com/ec2/pricing/on-demand/
    verified: "2026-09-14"

  - id: clb-private-same-vpc
    match: {route: clb, same_vpc: true, private_ip: true}
    billable: false
    confidence: high
    reason: "EC2↔Classic LB 사설 IP·동일 VPC 전송은 무료"
    source: https://aws.amazon.com/ec2/pricing/on-demand/
    verified: "2026-09-14"

  - id: lb-exemption-unverified
    match: {route: [alb, clb]}
    billable: true
    confidence: low
    reason: "IPv6·비사설 IPv4 타겟 또는 다른 VPC의 LB: ALB/CLB 전송 면제(사설 IP·동일 VPC)가 이 경우를 커버하는지 공식 문구 없음"
    source: https://aws.amazon.com/ec2/pricing/on-demand/
    verified: "2026-09-14"

  # ---------------------------------------------------------------- NLB (cross-zone off)
  - id: nlb-client-cross-az
    match: {route: nlb-zonal, scheme: internal}
    billable: true
    confidence: low
    reason: "cross-zone을 꺼도 VPC 내부 클라이언트가 DNS로 다른 AZ의 NLB 노드 IP를 받으면 과금. 클라이언트 위치·DNS 라우팅 정책에 좌우됨"
    source: https://aws.amazon.com/blogs/networking-and-content-delivery/exploring-data-transfer-costs-for-aws-network-load-balancers/
    verified: "2026-09-14"
    fix:
      kind: zonal-dns
      description: "클러스터 내부 호출이면 NLB 대신 ClusterIP + trafficDistribution 사용, 또는 NLB dns_record.client_routing_policy=availability_zone_affinity"

  - id: nlb-zonal-internet
    match: {route: nlb-zonal, scheme: internet-facing}
    billable: false
    confidence: medium
    reason: "cross-zone off: LB 노드는 같은 AZ 타겟에만 전달. 인터넷→NLB 유입은 AZ 간 전송이 아님 (VPC 내부에서 공인 IP로 호출하면 별도 공인 IP 요금)"
    source: https://aws.amazon.com/blogs/networking-and-content-delivery/exploring-data-transfer-costs-for-aws-network-load-balancers/
    verified: "2026-09-14"

  # ---------------------------------------------------------------- pod ↔ pod
  # 엔드포인트 없는 AZ의 호출자는 힌트가 동작하든 말든 넘어가므로 hints-unverified보다 먼저 확정한다.
  - id: clusterip-cross-az-partial
    match: {route: clusterip, az_spread: multi, zone_coverage: [partial, unknown]}
    billable: true
    confidence: high
    reason: "엔드포인트가 없는 AZ의 호출자는 항상 다른 AZ로 넘어감 (trafficDistribution으로도 해결 안 됨)"
    source: https://docs.aws.amazon.com/eks/latest/best-practices/cost-opt-networking.html
    verified: "2026-09-14"
    fix:
      kind: topologySpread
      description: "모든 AZ에 엔드포인트가 생기도록 topologySpreadConstraints(topology.kubernetes.io/zone) 추가 후 trafficDistribution 설정"

  - id: hints-unverified
    match: {route: clusterip, az_spread: multi, hints_configured: true, topology_hints: false}
    billable: true
    confidence: low
    reason: "trafficDistribution/topology-mode가 설정돼 있지만 kube-proxy 버전을 확인할 수 없거나(대체 프록시 포함) 힌트를 쓰지 않는 버전이거나, EndpointSlice 힌트가 없어 zone-local 여부를 확인할 수 없음"
    source: https://kubernetes.io/docs/concepts/services-networking/topology-aware-routing/
    verified: "2026-09-14"

  - id: clusterip-cross-az
    match: {route: clusterip, az_spread: multi}
    billable: true
    confidence: high
    reason: "kube-proxy가 AZ와 무관하게 엔드포인트를 고름. 다른 AZ pod로 가는 몫이 양쪽 $0.01/GB씩 과금"
    source: https://docs.aws.amazon.com/eks/latest/best-practices/cost-opt-networking.html
    verified: "2026-09-14"
    fix:
      kind: PreferClose
      description: "Service에 trafficDistribution 설정 (k8s 1.31-1.33: PreferClose, 1.34+: PreferSameZone — 같은 의미)"
      command: |
        kubectl patch svc -n {{.Namespace}} {{.Name}} --type=merge \
          -p '{"spec":{"trafficDistribution":"{{.TrafficDistribution}}"}}'

  - id: headless-cross-az
    match: {route: headless, az_spread: multi}
    billable: true
    confidence: high
    reason: "headless는 DNS로 pod IP에 직접 연결(kube-proxy 없음, trafficDistribution 무효). StatefulSet 복제가 AZ를 넘으면 과금"
    source: https://aws.amazon.com/ec2/pricing/on-demand/
    verified: "2026-09-14"
    fix:
      kind: relocate
      description: "복제 경로는 HA와 맞바꿈. Kafka는 broker.rack/client.rack(follower fetching), Elasticsearch는 shard allocation awareness로 읽기만 zone-local로"

  # ---------------------------------------------------------------- AWS 관리형 (클러스터 밖)
  - id: rds-multiaz-replication
    match: {target_kind: rds, traffic: replication}
    billable: false
    confidence: high
    reason: "Multi-AZ 프라이머리↔스탠바이, 같은 리전 read replica, Aurora 클러스터 복제는 무료"
    source: https://aws.amazon.com/rds/pricing/
    verified: "2026-09-14"

  - id: msk-inter-broker
    match: {target_kind: msk, traffic: replication}
    billable: false
    confidence: high
    reason: "MSK 브로커 간 복제는 요금에 포함"
    source: https://aws.amazon.com/msk/pricing/
    verified: "2026-09-14"

  - id: rds-cross-az
    match: {target_kind: rds, traffic: client, az_spread: multi}
    billable: true
    rate_gb: 0.01
    confidence: high
    reason: "pod↔다른 AZ의 RDS/Aurora 인스턴스(프라이머리·리플리카 모두). EC2 쪽만 $0.01/GB씩 과금"
    source: https://aws.amazon.com/rds/pricing/
    verified: "2026-09-14"
    fix:
      kind: relocate
      description: "읽기 트래픽은 같은 AZ 리플리카로 보내고, 쓰기 경로가 큰 워크로드는 프라이머리 AZ에 배치 검토"

  - id: elasticache-cross-az
    match: {target_kind: elasticache, traffic: client, az_spread: multi}
    billable: true
    rate_gb: 0.01
    confidence: high
    reason: "pod↔다른 AZ의 ElastiCache 노드. EC2 쪽만 $0.01/GB씩 과금"
    source: https://aws.amazon.com/elasticache/pricing/
    verified: "2026-09-14"
    fix:
      kind: relocate
      description: "읽기는 같은 AZ 리플리카로(클라이언트 AZ affinity), 노드를 호출자 AZ에 맞춰 배치"

  - id: msk-client-cross-az
    match: {target_kind: msk, traffic: client, az_spread: multi}
    billable: true
    rate_gb: 0.01
    confidence: medium
    reason: "클라이언트↔다른 AZ 브로커 전송은 표준 요금. 공식 확인된 것은 클라이언트(EC2) 쪽 — 하한으로 계산"
    source: https://aws.amazon.com/msk/pricing/
    verified: "2026-09-14"
    fix:
      kind: relocate
      description: "컨슈머에 client.rack=<AZ ID> 설정(follower fetching, replica.selector.class=RackAwareReplicaSelector)"

  # ---------------------------------------------------------------- catch-all
  - id: unclassified
    match: {}
    billable: false
    confidence: low
    reason: "어떤 규칙에도 맞지 않음 — 판정 보류"
